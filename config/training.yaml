# =============================================================================
# Stage 2 Training Configuration Overrides
# =============================================================================
training:
  algorithm: "PPO"
  total_timesteps: 100000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  reward_function: "risk_adjusted"
  policy_architecture: "mlp"
  eval_freq: 5000
  checkpoint_freq: 20000

log_level: "INFO"
