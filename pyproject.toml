[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade"
version = "0.1.0"
description = "Self-evolving trading system with RL-based production agent, learning agent, and validation gatekeeper"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core ML
    "torch>=2.3",
    "stable-baselines3>=2.3",
    "gymnasium>=1.0",

    # Data
    "yfinance>=0.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "ta>=0.11",

    # Storage
    "sqlalchemy>=2.0",

    # Model Management
    "mlflow>=2.15",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",

    # Config
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Secrets
    "python-binance>=18.0",
    "requests>=2.31",

    # Logging
    "structlog>=24.4",

    # Visualization
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["scripts", "src", "."]

