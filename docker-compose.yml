version: "3.9"

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TRADE_LOG_LEVEL: INFO
      TRADE_LOG_FORMAT: json
      TRADE_CONFIG_PATH: /app/config/production.yaml
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
      - ./mlflow_registry:/app/mlflow_registry
    restart: unless-stopped
    networks:
      - trading

  # Optional: PostgreSQL for production data storage
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - trading
    profiles:
      - prod

networks:
  trading:
    driver: bridge

volumes:
  postgres_data:
